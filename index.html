<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مقياس بيك للاكتئاب (BDI-II) - النسخة الأكاديمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* التزام تام بنفس التصميم والألوان الأصلية */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(145deg, #cfe9cf 0%, #a7c5a3 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .app-container { max-width: 1000px; width: 100%; background: #fef7e8; border-radius: 48px; box-shadow: 0 25px 45px rgba(60, 40, 20, 0.25); overflow: hidden; border: 1px solid #d9b48b; }
        .header { background: #5a3e2b; padding: 20px 35px; display: flex; align-items: center; justify-content: space-between; border-bottom: 6px solid #b9d8b3; }
        .logo-area { display: flex; align-items: center; gap: 20px; }
        .logo-icon { font-size: 2.5rem; color: #d9e6b3; }
        .title h1 { font-size: 1.6rem; color: #faf0e1; }
        .screen { padding: 30px 35px; display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
        .patient-form { background: #fff6ea; border-radius: 36px; padding: 35px; text-align: center; border: 1px solid #e2caac; }
        .input-group { margin: 25px 0; text-align: right; }
        .input-group label { display: block; font-weight: 700; color: #5a3e2b; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px 18px; border-radius: 60px; border: 1px solid #d4b48c; outline: none; font-family: 'Cairo'; }
        .btn { background: #6f8f5e; border: none; padding: 14px 35px; border-radius: 50px; font-weight: bold; color: white; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 0 #3e5a2e; transition: 0.2s; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3e5a2e; }
        .survey-grid { margin: 20px 0; max-height: 60vh; overflow-y: auto; padding: 15px; scrollbar-width: thin; scrollbar-color: #6f8f5e #fef7e8; }
        .question-item { background: #ffffff; border-radius: 28px; padding: 25px; border-right: 6px solid #b8cfaa; box-shadow: 0 5px 12px rgba(0,0,0,0.03); margin-bottom: 40px; scroll-margin-top: 20px; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { display: flex; align-items: center; gap: 10px; background: #f9efdf; padding: 12px 20px; border-radius: 50px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; text-align: right; border: 1px solid transparent; }
        .option:hover { background: #e9d9c5; }
        .option.selected { background: #6f8f5e; color: white; border-color: #3e5a2e; }
        .option input { display: none; }
        .result-card { background: #e6d5bd; border-radius: 42px; padding: 35px; text-align: center; border: 1px solid #cbb386; }
        .db-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 15px; overflow: hidden; }
        .db-table th, .db-table td { padding: 12px; border: 1px solid #e2caac; text-align: center; font-size: 0.9rem; }
        .db-table th { background: #5a3e2b; color: white; }
        footer { background: #5a3e2b; text-align: center; padding: 15px; color: #ecdbaa; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <div class="title"><h1>مقياس بيك للاكتئاب (BDI-II)</h1></div>
        </div>
        <div class="btn" style="padding: 8px 20px; font-size: 0.9rem;" onclick="showLogs()">سجل النتائج</div>
    </div>

    <div id="screen1" class="screen active">
        <div class="patient-form">
            <h2><i class="fas fa-user-medical"></i> بيانات المريض</h2>
            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" id="patientName" placeholder="ادخل اسم المريض الثلاثي">
            </div>
            <div class="input-group">
                <label>العمر</label>
                <input type="number" id="patientAge" placeholder="ادخل العمر">
            </div>
            <button class="btn" id="startSurveyBtn">بدء التشخيص الأكاديمي</button>
        </div>
    </div>

    <div id="screen2" class="screen">
        <div style="display: flex; justify-content: space-between; background: #e6d5bd; padding: 15px 20px; border-radius: 60px; margin-bottom: 20px;">
            <span id="answeredCount" style="background: #6f8f5e; color: white; padding: 5px 15px; border-radius: 40px; font-weight: bold;">0 / 21 تم الإجابة</span>
            <span id="pDisplay" style="font-weight: bold; color: #5a3e2b;"></span>
        </div>
        <div id="questionsContainer" class="survey-grid"></div>
        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <button class="btn" id="showResultBtn">تحليل وحفظ النتيجة</button>
        </div>
    </div>

    <div id="screen3" class="screen">
        <div id="resultDisplay"></div>
        <div style="text-align: center; margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
            <button class="btn" onclick="location.reload()">فحص جديد</button>
            <button class="btn" style="background: #5a3e2b;" onclick="showLogs()">عرض السجل العام</button>
        </div>
    </div>

    <div id="screen4" class="screen">
        <h2 style="text-align:center; color:#5a3e2b; margin-bottom:20px;">قاعدة بيانات المرضى</h2>
        <div style="overflow-x: auto;">
            <table class="db-table" id="logsTable">
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الاسم</th>
                        <th>العمر</th>
                        <th>الدرجة</th>
                        <th>التصنيف</th>
                    </tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" onclick="showScreen('screen1')">العودة للرئيسية</button>
            <button class="btn" style="background: #a53f2b;" onclick="clearDatabase()">مسح السجل</button>
        </div>
    </div>

    <footer>نظام أكاديمي متخصص للتقييم النفسي - يستند إلى معايير BDI-II</footer>
</div>

<script>
    const questions = [
        { q: "الحزن", options: ["لا أشعر بالحزن.", "أشعر بالحزن معظم الوقت.", "أنا حزين طوال الوقت ولا أستطيع الخروج من هذا الشعور.", "أنا حزين لدرجة أنني لا أستطيع الاحتمال."] },
        { q: "التشاؤم", options: ["لست محبطاً من المستقبل.", "أشعر بالإحباط من المستقبل أكثر مما كنت سابقاً.", "لا أتوقع أن تتحسن الأمور.", "أشعر أن مستقبلي يائس وأن الأمور ستزداد سوءاً."] },
        { q: "الشعور بالفشل", options: ["لا أشعر بأنني فاشل.", "لقد فشلت أكثر مما ينبغي.", "عندما أنظر إلى الماضي أرى الكثير من الفشل.", "أشعر أنني فاشل تماماً كشخص."] },
        { q: "فقدان المتعة", options: ["أحصل على نفس المتعة من الأشياء كالمعتاد.", "لا أستمتع بالأشياء كالمعتاد.", "أحصل على متعة قليلة جداً من الأشياء التي كنت أستمتع بها.", "لا أستطيع الحصول على أي متعة إطلاقاً."] },
        { q: "الشعور بالذنب", options: ["لا أشعر بذنب خاص.", "أشعر بالذنب في كثير من الأحيان.", "أشعر بالذنب في معظم الوقت.", "أشعر بالذنب طوال الوقت."] },
        { q: "الشعور بالعقاب", options: ["لا أشعر بأنني أعاقب.", "أشعر أنني قد أُعاقب.", "أتوقع أن أُعاقب.", "أشعر أنني أُعاقب الآن."] },
        { q: "كره الذات", options: ["شعوري تجاه نفسي لم يتغير.", "فقدت الثقة في نفسي.", "أنا خائب الأمل في نفسي.", "أنا أكره نفسي."] },
        { q: "نقد الذات", options: ["لا أنتقد أو ألوم نفسي أكثر من المعتاد.", "أنا أكثر نقداً لنفسي مما كنت سابقاً.", "أنتقد نفسي على كل أخطائي.", "ألوم نفسي على كل شيء سيء يحدث."] },
        { q: "الأفكار الانتحارية", options: ["ليس لدي أي أفكار في إيذاء نفسي.", "لدي أفكار في الانتحار ولكن لا أنفذها.", "أرغب في الانتحار.", "سوف أنتحر إذا سنحت لي الفرصة."] },
        { q: "البكاء", options: ["لا أبكي أكثر من المعتاد.", "أبكي الآن أكثر مما كنت سابقاً.", "أبكي على كل تافهة.", "أشعر برغبة في البكاء ولكنني لا أستطيع."] },
        { q: "الهياج والعصبية", options: ["لست متهيجاً أكثر من المعتاد.", "أنا متهيج أكثر من المعتاد.", "أنا متهيج جداً وأجد صعوبة في الهدوء.", "أنا متهيج لدرجة أنني يجب أن أتحرك باستمرار."] },
        { q: "فقدان الاهتمام", options: ["لم أفقد الاهتمام بالناس أو الأنشطة.", "أهتم بالناس أو الأشياء أقل مما كنت سابقاً.", "فقدت معظم اهتمامي بالناس أو الأشياء.", "من الصعب أن أهتم بأي شيء."] },
        { q: "التردد", options: ["أتخذ قراراتي بنفس الجودة كالمعتاد.", "أجد صعوبة في اتخاذ القرارات أكثر من المعتاد.", "أجد صعوبة كبيرة في اتخاذ القرارات.", "أواجه صعوبة في اتخاذ أي قرار."] },
        { q: "الشعور بعدم القيمة", options: ["لا أشعر بأنني بلا قيمة.", "لا أشعر بأنني ذو قيمة كما كنت سابقاً.", "أشعر بأنني أقل قيمة مقارنة بالآخرين.", "أشعر بأنني بلا قيمة تماماً."] },
        { q: "فقدان الطاقة", options: ["لدي طاقة كالمعتاد.", "لدي طاقة أقل مما كنت سابقاً.", "ليس لدي طاقة تكفي للقيام بالكثير.", "ليس لدي طاقة للقيام بأي شيء."] },
        { q: "تغير عادات النوم", options: ["لم ألاحظ أي تغير في نومي.", "أنام أكثر/أقل من المعتاد قليلاً.", "أنام أكثر/أقل بكثير من المعتاد.", "أنام طوال اليوم أو أستيقظ طوال الليل."] },
        { q: "سرعة الانفعال", options: ["لست سريع الانفعال أكثر من المعتاد.", "أنا أكثر انفعالاً من المعتاد.", "أنا سريع الانفعال جداً معظم الوقت.", "أنا منفعل طوال الوقت."] },
        { q: "تغير الشهية", options: ["لم يتغير شيء في شهيتي.", "شهيتي أقل/أكثر من المعتاد بقليل.", "شهيتي أقل/أكثر من المعتاد بكثير.", "ليس لدي شهية إطلاقاً أو أريد الأكل طوال الوقت."] },
        { q: "صعوبة التركيز", options: ["أستطيع التركيز كالمعتاد.", "لا أستطيع التركيز كالمعتاد.", "من الصعب أن أركز في أي شيء لفترة طويلة.", "لا أستطيع التركيز في أي شيء."] },
        { q: "التعب والإجهاد", options: ["لست متعباً أكثر من المعتاد.", "أشعر بالتعب أسرع من المعتاد.", "أنا متعب جداً من القيام بأشياء بسيطة.", "أنا متعب جداً لدرجة لا أستطيع القيام بأي شيء."] },
        { q: "فقدان الاهتمام بالجنس", options: ["لم أفقد الاهتمام بالجنس.", "أنا أقل اهتماماً بالجنس عما كنت سابقاً.", "أنا أقل اهتماماً بالجنس جداً الآن.", "فقدت الاهتمام بالجنس تماماً."] }
    ];

    let patientData = { name: "", age: "" };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function generateQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = questions.map((item, i) => `
            <div class="question-item" id="q-box-${i}">
                <div style="font-weight:700; color:#5a3e2b; font-size:1.1rem;">${i+1}. ${item.q}</div>
                <div class="options">
                    ${item.options.map((opt, v) => `
                        <label class="option" onclick="selectOption(this, ${i})">
                            <input type="radio" name="q${i}" value="${v}"> ${opt}
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function selectOption(el, index) {
        el.parentElement.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('answeredCount').innerText = `${document.querySelectorAll('input:checked').length} / 21 تم الإجابة`;
        const next = document.getElementById(`q-box-${index + 1}`);
        if(next) setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
    }

    document.getElementById('startSurveyBtn').onclick = () => {
        const nameInput = document.getElementById('patientName').value.trim();
        const ageInput = document.getElementById('patientAge').value;
        
        if(!nameInput || !ageInput) return alert("يرجى إكمال بيانات المريض أولاً");
        
        patientData.name = nameInput;
        patientData.age = ageInput;
        document.getElementById('pDisplay').innerText = `المريض: ${patientData.name}`;
        showScreen('screen2');
        generateQuestions();
    };

    document.getElementById('showResultBtn').onclick = () => {
        let score = 0;
        const checked = document.querySelectorAll('input:checked');
        if(checked.length < 21) return alert("يرجى الإجابة على جميع البنود (21 بنداً) لضمان دقة التشخيص الأكاديمي.");
        
        checked.forEach(i => score += parseInt(i.value));

        let level = "", color = "", advice = "";
        
        if (score <= 13) { 
            level = "اكتئاب في حدوده الدنيا (Minimal)"; 
            color = "#6f8f5e"; 
            advice = "تُظهر النتائج استقراراً نفسياً ضمن الحدود الطبيعية. ننصح بالاستمرار في ممارسة الهوايات والحفاظ على التواصل الاجتماعي الصحي."; 
        }
        else if (score <= 19) { 
            level = "اكتئاب خفيف (Mild)"; 
            color = "#b4a03a"; 
            advice = "هناك مؤشرات بسيطة على انخفاض المزاج. ننصح بتنظيم النوم، ممارسة الرياضة، والتحدث مع صديق مقرب أو مستشار تربوي."; 
        }
        else if (score <= 28) { 
            level = "اكتئاب متوسط (Moderate)"; 
            color = "#d9822b"; 
            advice = "توجد أعراض اكتئاب واضحة قد تؤثر على جودة حياتك اليومية. من الضروري مراجعة أخصائي نفسي لتقديم الدعم السلوكي المعرفي المناسب."; 
        }
        else { 
            level = "اكتئاب شديد (Severe)"; 
            color = "#a53f2b"; 
            advice = "درجتك تشير إلى معاناة نفسية كبيرة. يرجى التوجه فوراً لزيارة طبيب نفسي مختص لتقييم الحالة سريرياً ووضع خطة علاجية عاجلة."; 
        }

        // حفظ البيانات في قاعدة البيانات المحلية
        saveToDB(patientData.name, patientData.age, score, level);

        document.getElementById('resultDisplay').innerHTML = `
            <div class="result-card" style="border-top: 10px solid ${color}">
                <p style="color:#5a3e2b; font-weight:bold;">تقرير المريض: ${patientData.name}</p>
                <h2>النتيجة النهائية للمقياس</h2>
                <div style="font-size:2.8rem; font-weight:800; color:${color}; margin:15px 0;">${score}</div>
                <div style="font-size:1.4rem; font-weight:bold; color:#5a3e2b;">التصنيف الأكاديمي: ${level}</div>
                <div style="margin-top:20px; background:white; padding:20px; border-radius:20px; border:1px dashed ${color}; text-align:right;">
                    <strong style="color:${color}"><i class="fas fa-hand-holding-heart"></i> نصيحة المريض:</strong>
                    <p style="margin-top:10px; line-height:1.6; color:#444;">${advice}</p>
                </div>
            </div>`;
        showScreen('screen3');
    };

    // وظائف قاعدة البيانات
    function saveToDB(name, age, score, level) {
        const logs = JSON.parse(localStorage.getItem('bdi_logs') || "[]");
        const entry = {
            date: new Date().toLocaleString('ar-EG'),
            name: name,
            age: age,
            score: score,
            level: level
        };
        logs.push(entry);
        localStorage.setItem('bdi_logs', JSON.stringify(logs));
    }

    function showLogs() {
        const logs = JSON.parse(localStorage.getItem('bdi_logs') || "[]");
        const tbody = document.getElementById('logsBody');
        tbody.innerHTML = logs.map(log => `
            <tr>
                <td>${log.date}</td>
                <td>${log.name}</td>
                <td>${log.age}</td>
                <td>${log.score}</td>
                <td>${log.level}</td>
            </tr>
        `).join('');
        if(logs.length === 0) tbody.innerHTML = "<tr><td colspan='5'>لا توجد بيانات مسجلة حالياً</td></tr>";
        showScreen('screen4');
    }

    function clearDatabase() {
        if(confirm("هل أنت متأكد من مسح جميع بيانات المرضى؟")) {
            localStorage.removeItem('bdi_logs');
            showLogs();
        }
    }
</script>
</body>
</html>
